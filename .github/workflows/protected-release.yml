name: Protected Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: protected-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release tag and source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tagged commit with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Verify version and default-branch tip
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          bun scripts/ci/verify-release-version.mjs "$GITHUB_REF_NAME"

          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "本地 HEAD $head_sha 与触发提交 $GITHUB_SHA 不一致" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "找不到默认分支 origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

          default_branch_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$GITHUB_SHA" != "$default_branch_sha" ]]; then
            echo "发布 tag 必须精确指向触发时默认分支 $DEFAULT_BRANCH 的 tip $default_branch_sha" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "preflight 检出后 tracked worktree 不干净" >&2
            exit 1
          fi

  build-windows:
    name: Test and build unsigned Windows updater
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      unsigned_artifact_name: ${{ steps.unsigned.outputs.artifact_name }}
      unsigned_artifact_digest: ${{ steps.upload_unsigned.outputs.artifact-digest }}
      verifier_artifact_name: ${{ steps.verifier.outputs.artifact_name }}
      verifier_artifact_digest: ${{ steps.upload_verifier.outputs.artifact-digest }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-

      - name: Install Rust 1.95.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) {
            throw "安装 Rust 1.95.0 失败"
          }

          & rustup default 1.95.0
          if ($LASTEXITCODE -ne 0) {
            throw "切换 Rust 1.95.0 失败"
          }

          $rustVersion = (@(& rustc --version) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $rustVersion -notmatch '^rustc 1\.95\.0(?:\s|$)') {
            throw "Rust 版本不匹配: $rustVersion"
          }

      - name: Cache Cargo downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-1.95.0-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-1.95.0-

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            throw "安装依赖失败"
          }

      - name: Verify pinned release tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & bun scripts/ci/verify-release-version.mjs "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "发布版本校验失败"
          }

          $tauriCli = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/node_modules/.bin/tauri.exe"
          if (-not (Test-Path -LiteralPath $tauriCli -PathType Leaf)) {
            throw "固定 Tauri CLI 不存在: $tauriCli"
          }

          $tauriVersion = (@(& $tauriCli --version) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $tauriVersion -cne "tauri-cli 2.11.3") {
            throw "Tauri CLI 版本不匹配: $tauriVersion"
          }

      - name: Typecheck workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun run typecheck
          if ($LASTEXITCODE -ne 0) {
            throw "类型检查失败"
          }

      - name: Test workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun run test
          if ($LASTEXITCODE -ne 0) {
            throw "Bun 测试失败"
          }

      - name: Build web app for Tauri checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun run web:build
          if ($LASTEXITCODE -ne 0) {
            throw "构建 Web 应用失败"
          }

      - name: Validate Cargo metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo metadata 校验失败"
          }

      - name: Check Rust formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) {
            throw "Rust 格式校验失败"
          }

      - name: Lint Rust targets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) {
            throw "Rust Clippy 校验失败"
          }

      - name: Test Rust workspace and updater verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) {
            throw "Rust 测试失败"
          }

          & cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --example verify_updater_signature
          if ($LASTEXITCODE -ne 0) {
            throw "updater 签名 verifier 测试失败"
          }

          & cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --example verify_updater_signature
          if ($LASTEXITCODE -ne 0) {
            throw "构建 updater 签名 verifier 失败"
          }

      - name: Locate updater signature verifier
        id: verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $verifierPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/debug/examples/verify_updater_signature.exe"
          if (-not (Test-Path -LiteralPath $verifierPath -PathType Leaf)) {
            throw "updater 签名 verifier 不存在: $verifierPath"
          }

          if ((Get-Item -LiteralPath $verifierPath).Length -le 0) {
            throw "updater 签名 verifier 为空: $verifierPath"
          }

          "path=$verifierPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=release-verifier-$env:GITHUB_RUN_ATTEMPT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload updater signature verifier
        id: upload_verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.verifier.outputs.artifact_name }}
          path: ${{ steps.verifier.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false

      - name: Build unsigned NSIS bundle
        shell: pwsh
        env:
          MINERADIO_OFFICIAL_DISTRIBUTION: github-release-v1
        run: |
          $ErrorActionPreference = "Stop"
          & bun run --filter ./apps/desktop tauri build --bundles nsis --ci --no-sign -- --locked
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS 构建失败"
          }

      - name: Verify source and locate unsigned NSIS bundle
        id: unsigned
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $headSha = (@(& git rev-parse HEAD) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -cne $env:GITHUB_SHA) {
            throw "构建后本地 HEAD $headSha 与触发提交 $env:GITHUB_SHA 不一致"
          }

          $trackedChanges = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0) {
            throw "读取 tracked worktree 状态失败"
          }
          if ($trackedChanges.Count -ne 0) {
            throw "构建后 tracked worktree 不干净"
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exeName = "MineRadio-Tauri_${version}_x64-setup.exe"
          $exePath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/bundle/nsis/$exeName"
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "unsigned NSIS 产物不存在: $exePath"
          }
          if ((Get-Item -LiteralPath $exePath).Length -le 0) {
            throw "unsigned NSIS 产物为空: $exePath"
          }

          "path=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=unsigned-nsis-$env:GITHUB_RUN_ATTEMPT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned NSIS bundle
        id: upload_unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.unsigned.outputs.artifact_name }}
          path: ${{ steps.unsigned.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false

  sign-windows:
    name: Sign updater artifacts on isolated runner
    needs: build-windows
    runs-on: windows-2022
    environment: production-release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      signed_artifact_name: ${{ steps.signing.outputs.signed_artifact_name }}
      signed_artifact_digest: ${{ steps.upload_signed.outputs.artifact-digest }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-

      - name: Install signer dependencies without lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            throw "安装签名依赖失败"
          }

      - name: Download unsigned NSIS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.unsigned_artifact_name }}
          path: ${{ runner.temp }}\unsigned-nsis

      - name: Download updater signature verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.verifier_artifact_name }}
          path: ${{ runner.temp }}\release-verifier

      - name: Prepare isolated signing inputs
        id: signing
        shell: pwsh
        env:
          UNSIGNED_ARTIFACT_DIGEST: ${{ needs.build-windows.outputs.unsigned_artifact_digest }}
          VERIFIER_ARTIFACT_DIGEST: ${{ needs.build-windows.outputs.verifier_artifact_digest }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($digest in @($env:UNSIGNED_ARTIFACT_DIGEST, $env:VERIFIER_ARTIFACT_DIGEST)) {
            if ($digest -notmatch '^[0-9a-f]{64}$') {
              throw "Actions artifact digest 格式无效: $digest"
            }
          }

          $headSha = (@(& git rev-parse HEAD) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -cne $env:GITHUB_SHA) {
            throw "签名前本地 HEAD $headSha 与触发提交 $env:GITHUB_SHA 不一致"
          }

          $trackedChanges = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $trackedChanges.Count -ne 0) {
            throw "签名前 tracked worktree 不干净"
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exeName = "MineRadio-Tauri_${version}_x64-setup.exe"
          $downloadedExePath = Join-Path $env:RUNNER_TEMP "unsigned-nsis/$exeName"
          $verifierPath = Join-Path $env:RUNNER_TEMP "release-verifier/verify_updater_signature.exe"
          foreach ($requiredPath in @($downloadedExePath, $verifierPath)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "签名输入不存在: $requiredPath"
            }
            if ((Get-Item -LiteralPath $requiredPath).Length -le 0) {
              throw "签名输入为空: $requiredPath"
            }
          }

          $signedDirectory = Join-Path $env:RUNNER_TEMP "signed-release"
          if (Test-Path -LiteralPath $signedDirectory) {
            throw "签名输出目录已存在: $signedDirectory"
          }
          New-Item -ItemType Directory -Path $signedDirectory | Out-Null

          $exePath = Join-Path $signedDirectory $exeName
          Copy-Item -LiteralPath $downloadedExePath -Destination $exePath

          $tauriCliPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/node_modules/.bin/tauri.exe"
          if (-not (Test-Path -LiteralPath $tauriCliPath -PathType Leaf)) {
            throw "固定 Tauri CLI 不存在: $tauriCliPath"
          }
          $tauriVersion = (@(& $tauriCliPath --version) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $tauriVersion -cne "tauri-cli 2.11.3") {
            throw "Tauri CLI 版本不匹配: $tauriVersion"
          }

          $bunPath = (Get-Command bun -ErrorAction Stop).Source
          $bunVersion = (@(& $bunPath --version) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $bunVersion -cne "1.4.0") {
            throw "Bun 版本不匹配: $bunVersion"
          }

          "bun_path=$bunPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tauri_cli_path=$tauriCliPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verifier_path=$verifierPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tauri_config_path=$(Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/tauri.conf.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_path=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_sig_path=$exePath.sig" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_path=$(Join-Path $signedDirectory 'latest.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "provenance_path=$(Join-Path $signedDirectory 'release-provenance.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "provenance_sig_path=$(Join-Path $signedDirectory 'release-provenance.json.sig')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signed_artifact_name=signed-release-$env:GITHUB_RUN_ATTEMPT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Sign updater executable
        shell: pwsh
        env:
          TAURI_CLI_PATH: ${{ steps.signing.outputs.tauri_cli_path }}
          EXE_PATH: ${{ steps.signing.outputs.exe_path }}
          EXE_SIG_PATH: ${{ steps.signing.outputs.exe_sig_path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath $env:EXE_SIG_PATH) {
            throw "签名前 updater 签名文件已存在: $env:EXE_SIG_PATH"
          }

          & $env:TAURI_CLI_PATH signer sign $env:EXE_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "updater 产物签名失败"
          }

          if (-not (Test-Path -LiteralPath $env:EXE_SIG_PATH -PathType Leaf)) {
            throw "updater 签名文件不存在: $env:EXE_SIG_PATH"
          }
          if ((Get-Item -LiteralPath $env:EXE_SIG_PATH).Length -le 0) {
            throw "updater 签名文件为空: $env:EXE_SIG_PATH"
          }

      - name: Create updater manifest and release provenance
        shell: pwsh
        env:
          BUN_PATH: ${{ steps.signing.outputs.bun_path }}
          EXE_PATH: ${{ steps.signing.outputs.exe_path }}
          EXE_SIG_PATH: ${{ steps.signing.outputs.exe_sig_path }}
          MANIFEST_PATH: ${{ steps.signing.outputs.manifest_path }}
          PROVENANCE_PATH: ${{ steps.signing.outputs.provenance_path }}
        run: |
          $ErrorActionPreference = "Stop"

          & $env:BUN_PATH scripts/ci/create-updater-manifest.mjs $env:GITHUB_REF_NAME $env:GITHUB_REPOSITORY $env:EXE_PATH $env:EXE_SIG_PATH $env:MANIFEST_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "创建 updater manifest 失败"
          }

          & $env:BUN_PATH scripts/ci/release-provenance.mjs create $env:GITHUB_REPOSITORY $env:GITHUB_REF_NAME $env:GITHUB_SHA $env:PROVENANCE_PATH $env:EXE_PATH $env:EXE_SIG_PATH $env:MANIFEST_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "创建 release provenance 失败"
          }

      - name: Sign release provenance
        shell: pwsh
        env:
          TAURI_CLI_PATH: ${{ steps.signing.outputs.tauri_cli_path }}
          PROVENANCE_PATH: ${{ steps.signing.outputs.provenance_path }}
          PROVENANCE_SIG_PATH: ${{ steps.signing.outputs.provenance_sig_path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath $env:PROVENANCE_SIG_PATH) {
            throw "签名前 provenance 签名文件已存在: $env:PROVENANCE_SIG_PATH"
          }

          & $env:TAURI_CLI_PATH signer sign $env:PROVENANCE_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "release provenance 签名失败"
          }

          if (-not (Test-Path -LiteralPath $env:PROVENANCE_SIG_PATH -PathType Leaf)) {
            throw "provenance 签名文件不存在: $env:PROVENANCE_SIG_PATH"
          }
          if ((Get-Item -LiteralPath $env:PROVENANCE_SIG_PATH).Length -le 0) {
            throw "provenance 签名文件为空: $env:PROVENANCE_SIG_PATH"
          }

      - name: Verify signed release package
        shell: pwsh
        env:
          BUN_PATH: ${{ steps.signing.outputs.bun_path }}
          VERIFIER_PATH: ${{ steps.signing.outputs.verifier_path }}
          TAURI_CONFIG_PATH: ${{ steps.signing.outputs.tauri_config_path }}
          EXE_PATH: ${{ steps.signing.outputs.exe_path }}
          EXE_SIG_PATH: ${{ steps.signing.outputs.exe_sig_path }}
          MANIFEST_PATH: ${{ steps.signing.outputs.manifest_path }}
          PROVENANCE_PATH: ${{ steps.signing.outputs.provenance_path }}
          PROVENANCE_SIG_PATH: ${{ steps.signing.outputs.provenance_sig_path }}
        run: |
          $ErrorActionPreference = "Stop"

          & $env:VERIFIER_PATH $env:TAURI_CONFIG_PATH $env:EXE_PATH $env:EXE_SIG_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "updater 产物真实验签失败"
          }

          & $env:VERIFIER_PATH $env:TAURI_CONFIG_PATH $env:PROVENANCE_PATH $env:PROVENANCE_SIG_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "release provenance 真实验签失败"
          }

          & $env:BUN_PATH scripts/ci/release-provenance.mjs verify $env:GITHUB_REPOSITORY $env:GITHUB_REF_NAME $env:GITHUB_SHA $env:PROVENANCE_PATH $env:EXE_PATH $env:EXE_SIG_PATH $env:MANIFEST_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "release provenance 内容校验失败"
          }

          $expectedNames = @(
            [System.IO.Path]::GetFileName($env:EXE_PATH),
            [System.IO.Path]::GetFileName($env:EXE_SIG_PATH),
            "latest.json",
            "release-provenance.json",
            "release-provenance.json.sig"
          )
          $signedDirectory = Split-Path -Parent $env:EXE_PATH
          $actualFiles = @(Get-ChildItem -LiteralPath $signedDirectory -File)
          $actualNames = @($actualFiles | ForEach-Object { $_.Name })
          $difference = @(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames -CaseSensitive)
          if ($actualFiles.Count -ne 5 -or $difference.Count -ne 0) {
            throw "签名发布资产集合不匹配"
          }
          foreach ($file in $actualFiles) {
            if ($file.Length -le 0) {
              throw "签名发布资产为空: $($file.FullName)"
            }
          }

          $trackedChanges = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $trackedChanges.Count -ne 0) {
            throw "签名后 tracked worktree 不干净"
          }

      - name: Upload signed release package
        id: upload_signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.signing.outputs.signed_artifact_name }}
          path: |
            ${{ steps.signing.outputs.exe_path }}
            ${{ steps.signing.outputs.exe_sig_path }}
            ${{ steps.signing.outputs.manifest_path }}
            ${{ steps.signing.outputs.provenance_path }}
            ${{ steps.signing.outputs.provenance_sig_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false

  stage-release-draft:
    name: Freeze verified Draft Release
    needs:
      - build-windows
      - sign-windows
    runs-on: windows-2022
    environment: production-release
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.stage.outputs.release_id }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Download signed release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign-windows.outputs.signed_artifact_name }}
          path: ${{ runner.temp }}\signed-release

      - name: Download updater signature verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.verifier_artifact_name }}
          path: ${{ runner.temp }}\release-verifier

      - name: Verify publication inputs
        id: release
        shell: pwsh
        env:
          SIGNED_ARTIFACT_DIGEST: ${{ needs.sign-windows.outputs.signed_artifact_digest }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:SIGNED_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "signed Actions artifact digest 格式无效: $env:SIGNED_ARTIFACT_DIGEST"
          }

          $headSha = (@(& git rev-parse HEAD) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -cne $env:GITHUB_SHA) {
            throw "发布前本地 HEAD $headSha 与触发提交 $env:GITHUB_SHA 不一致"
          }
          $trackedChanges = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $trackedChanges.Count -ne 0) {
            throw "发布前 tracked worktree 不干净"
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exeName = "MineRadio-Tauri_${version}_x64-setup.exe"
          $signedDirectory = Join-Path $env:RUNNER_TEMP "signed-release"
          $verifierPath = Join-Path $env:RUNNER_TEMP "release-verifier/verify_updater_signature.exe"
          $expectedNames = @(
            $exeName,
            "$exeName.sig",
            "latest.json",
            "release-provenance.json",
            "release-provenance.json.sig"
          )
          $actualFiles = @(Get-ChildItem -LiteralPath $signedDirectory -File)
          $actualNames = @($actualFiles | ForEach-Object { $_.Name })
          $difference = @(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames -CaseSensitive)
          if ($actualFiles.Count -ne 5 -or $difference.Count -ne 0) {
            throw "待发布资产集合不匹配"
          }
          $requiredPaths = @($actualFiles | ForEach-Object { $_.FullName })
          $requiredPaths += $verifierPath
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "待发布输入不存在: $requiredPath"
            }
            if ((Get-Item -LiteralPath $requiredPath).Length -le 0) {
              throw "待发布输入为空: $requiredPath"
            }
          }

          $bunPath = (Get-Command bun -ErrorAction Stop).Source
          $bunVersion = (@(& $bunPath --version) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $bunVersion -cne "1.4.0") {
            throw "Bun 版本不匹配: $bunVersion"
          }

          $tauriConfigPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json"
          $exePath = Join-Path $signedDirectory $exeName
          $exeSigPath = Join-Path $signedDirectory "$exeName.sig"
          $manifestPath = Join-Path $signedDirectory "latest.json"
          $provenancePath = Join-Path $signedDirectory "release-provenance.json"
          $provenanceSigPath = Join-Path $signedDirectory "release-provenance.json.sig"

          "bun_path=$bunPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verifier_path=$verifierPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tauri_config_path=$tauriConfigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_path=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_sig_path=$exeSigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_path=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "provenance_path=$provenancePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "provenance_sig_path=$provenanceSigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Freeze verified Draft release
        id: stage
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUN_PATH: ${{ steps.release.outputs.bun_path }}
          SIGNATURE_VERIFIER_PATH: ${{ steps.release.outputs.verifier_path }}
          TAURI_CONFIG_PATH: ${{ steps.release.outputs.tauri_config_path }}
          EXE_PATH: ${{ steps.release.outputs.exe_path }}
          EXE_SIG_PATH: ${{ steps.release.outputs.exe_sig_path }}
          MANIFEST_PATH: ${{ steps.release.outputs.manifest_path }}
          PROVENANCE_PATH: ${{ steps.release.outputs.provenance_path }}
          PROVENANCE_SIG_PATH: ${{ steps.release.outputs.provenance_sig_path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"

          & $env:BUN_PATH scripts/ci/stage-release-draft.mjs `
            --repository $env:GITHUB_REPOSITORY `
            --tag $env:GITHUB_REF_NAME `
            --commit-sha $env:GITHUB_SHA `
            --default-branch $env:DEFAULT_BRANCH `
            --tauri-config-path $env:TAURI_CONFIG_PATH `
            --signature-verifier-path $env:SIGNATURE_VERIFIER_PATH `
            --exe-path $env:EXE_PATH `
            --exe-sig-path $env:EXE_SIG_PATH `
            --manifest-path $env:MANIFEST_PATH `
            --provenance-path $env:PROVENANCE_PATH `
            --provenance-sig-path $env:PROVENANCE_SIG_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Draft Release 冻结失败"
          }

  smoke-upgrade:
    name: Upgrade the previous release through the Draft runtime
    needs:
      - build-windows
      - sign-windows
      - stage-release-draft
    runs-on: windows-2022
    environment: production-release
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_id: ${{ steps.smoke.outputs.candidate_id }}
      previous_version: ${{ steps.smoke.outputs.previous_version }}
      target_version: ${{ steps.smoke.outputs.target_version }}
      evidence_sha256: ${{ steps.smoke.outputs.evidence_sha256 }}
      evidence_artifact_digest: ${{ steps.upload_evidence.outputs.artifact-digest }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install Rust 1.95.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "安装 Rust 1.95.0 失败" }
          & rustup default 1.95.0
          if ($LASTEXITCODE -ne 0) { throw "切换 Rust 1.95.0 失败" }

      - name: Install workspace dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "安装 smoke 依赖失败" }

      - name: Build CI-only updater smoke harness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cargo build `
            --manifest-path apps/desktop/src-tauri/Cargo.toml `
            --release `
            --locked `
            --features updater-smoke `
            --example updater-smoke
          if ($LASTEXITCODE -ne 0) { throw "构建 updater smoke harness 失败" }

      - name: Download updater signature verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.verifier_artifact_name }}
          path: ${{ runner.temp }}\release-verifier

      - name: Prepare isolated smoke paths
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "mineradio-draft-smoke-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw "smoke root 已存在" }
          $inputs = Join-Path $root "inputs"
          $tools = Join-Path $inputs "tools"
          $work = Join-Path $root "work"
          New-Item -ItemType Directory -Path $tools | Out-Null
          New-Item -ItemType Directory -Path $work | Out-Null

          $harnessSource = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/examples/updater-smoke.exe"
          $verifierSource = Join-Path $env:RUNNER_TEMP "release-verifier/verify_updater_signature.exe"
          $configSource = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json"
          $runnerSource = Join-Path $env:GITHUB_WORKSPACE "scripts/ci/run-draft-upgrade-smoke.ps1"
          foreach ($path in @($harnessSource, $verifierSource, $configSource, $runnerSource)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "smoke 工具不存在: $path"
            }
          }
          Copy-Item -LiteralPath $harnessSource -Destination (Join-Path $tools "updater-smoke.exe")
          Copy-Item -LiteralPath $verifierSource -Destination (Join-Path $tools "verify-updater-signature.exe")
          Copy-Item -LiteralPath $configSource -Destination (Join-Path $tools "tauri.conf.json")
          Copy-Item -LiteralPath $runnerSource -Destination (Join-Path $tools "run-draft-upgrade-smoke.ps1")

          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "inputs=$inputs" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "work=$work" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "draft=$(Join-Path $inputs 'draft')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous=$(Join-Path $inputs 'previous')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_data=$(Join-Path $work 'app-data')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "evidence=$(Join-Path $work 'smoke-evidence.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "harness=$(Join-Path $tools 'updater-smoke.exe')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verifier=$(Join-Path $tools 'verify-updater-signature.exe')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tauri_config=$(Join-Path $tools 'tauri.conf.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "runner=$(Join-Path $tools 'run-draft-upgrade-smoke.ps1')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download exact Draft assets without exposing token to the app
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.stage-release-draft.outputs.release_id }}
          DRAFT_STAGING: ${{ steps.paths.outputs.draft }}
        run: |
          $ErrorActionPreference = "Stop"
          & bun scripts/ci/download-draft-release.mjs `
            $env:GITHUB_REPOSITORY `
            $env:GITHUB_REF_NAME `
            $env:GITHUB_SHA `
            $env:RELEASE_ID `
            $env:DRAFT_STAGING
          if ($LASTEXITCODE -ne 0) { throw "下载 exact Draft 资产失败" }

      - name: Download the highest stable N-1 release
        id: previous
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_STAGING: ${{ steps.paths.outputs.previous }}
        run: |
          $ErrorActionPreference = "Stop"
          & bun scripts/ci/download-previous-release.mjs `
            $env:GITHUB_REPOSITORY `
            $env:GITHUB_REF_NAME `
            $env:PREVIOUS_STAGING
          if ($LASTEXITCODE -ne 0) { throw "下载 N-1 Release 失败" }

      - name: Verify N-1 installer signature before execution
        shell: pwsh
        env:
          VERIFIER_PATH: ${{ steps.paths.outputs.verifier }}
          TAURI_CONFIG_PATH: ${{ steps.paths.outputs.tauri_config }}
          PREVIOUS_INSTALLER: ${{ steps.previous.outputs.previous_installer }}
          PREVIOUS_SIGNATURE: ${{ steps.previous.outputs.previous_signature }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN) {
            throw "N-1 verifier 不得继承 GitHub token"
          }
          & $env:VERIFIER_PATH `
            $env:TAURI_CONFIG_PATH `
            $env:PREVIOUS_INSTALLER `
            $env:PREVIOUS_SIGNATURE
          if ($LASTEXITCODE -ne 0) { throw "N-1 installer Minisign 验证失败" }

      - name: Install N-1 and upgrade to the Draft as a standard user
        id: smoke
        shell: pwsh
        env:
          SMOKE_ROOT: ${{ steps.paths.outputs.root }}
          SMOKE_INPUTS: ${{ steps.paths.outputs.inputs }}
          SMOKE_WORK: ${{ steps.paths.outputs.work }}
          SMOKE_RUNNER: ${{ steps.paths.outputs.runner }}
          SMOKE_HARNESS: ${{ steps.paths.outputs.harness }}
          TAURI_CONFIG_PATH: ${{ steps.paths.outputs.tauri_config }}
          DRAFT_STAGING: ${{ steps.paths.outputs.draft }}
          APP_DATA_PATH: ${{ steps.paths.outputs.app_data }}
          EVIDENCE_PATH: ${{ steps.paths.outputs.evidence }}
          PREVIOUS_INSTALLER: ${{ steps.previous.outputs.previous_installer }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous_version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN) {
            throw "真实安装 step 不得继承 GitHub token"
          }

          $jobOutputPath = $env:GITHUB_OUTPUT
          if (-not [System.IO.Path]::IsPathFullyQualified($jobOutputPath)) {
            throw "GitHub output capability 路径无效"
          }

          $CredentialEnvironmentNamePattern = '(?i)(TOKEN|SECRET|PASSWORD|PASSWD|PASSPHRASE|PRIVATE_KEY|ACCESS_KEY|API_KEY|CREDENTIAL|AUTHORIZATION)'
          $CredentialCapabilityNames = @(
            "ACTIONS_CACHE_URL",
            "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
            "ACTIONS_ID_TOKEN_REQUEST_URL",
            "ACTIONS_RESULTS_URL",
            "ACTIONS_RUNTIME_TOKEN",
            "ACTIONS_RUNTIME_URL",
            "GH_TOKEN",
            "GITHUB_ENV",
            "GITHUB_OUTPUT",
            "GITHUB_PATH",
            "GITHUB_STATE",
            "GITHUB_STEP_SUMMARY",
            "GITHUB_TOKEN",
            "SSH_AGENT_PID",
            "SSH_AUTH_SOCK",
            "VSS_NUGET_EXTERNAL_FEED_ENDPOINTS"
          )

          function Get-CredentialEnvironmentNames {
            return @(
              Get-ChildItem Env: |
                ForEach-Object { [string] $_.Name } |
                Where-Object {
                  $_ -match $CredentialEnvironmentNamePattern -or
                  $CredentialCapabilityNames -ccontains $_
                } |
                Sort-Object -Unique
            )
          }

          function Remove-CredentialEnvironment {
            foreach ($name in @(Get-CredentialEnvironmentNames)) {
              Remove-Item -LiteralPath "Env:$name" -ErrorAction Stop
            }
            if (@(Get-CredentialEnvironmentNames).Count -ne 0) {
              throw "创建标准用户 child 前无法清除 credential-like CI 环境变量"
            }
          }

          function Invoke-SmokeIcacls([string] $Path, [string[]] $AclArguments, [string] $Failure) {
            & icacls.exe $Path @AclArguments | Out-Null
            if ($LASTEXITCODE -ne 0) { throw $Failure }
          }

          function Protect-SmokeReadOnlyTree([string] $Path, [string] $smokePrincipal, [string] $runnerPrincipal) {
            Invoke-SmokeIcacls `
              -Path $Path `
              -AclArguments @("/inheritance:r", "/T", "/C", "/Q") `
              -Failure "无法隔离 smoke 只读树"
            Invoke-SmokeIcacls `
              -Path $Path `
              -AclArguments @(
                "/grant:r",
                "${runnerPrincipal}:(OI)(CI)F",
                "*S-1-5-18:(OI)(CI)F",
                "*S-1-5-32-544:(OI)(CI)F",
                "${smokePrincipal}:(OI)(CI)RX",
                "/T", "/C", "/Q"
              ) `
              -Failure "无法授权 smoke 只读树"
          }

          function Protect-SmokeWritableTree([string] $Path, [string] $smokePrincipal, [string] $runnerPrincipal) {
            Invoke-SmokeIcacls `
              -Path $Path `
              -AclArguments @("/inheritance:r", "/T", "/C", "/Q") `
              -Failure "无法隔离 smoke 可写树"
            Invoke-SmokeIcacls `
              -Path $Path `
              -AclArguments @(
                "/grant:r",
                "${runnerPrincipal}:(OI)(CI)F",
                "*S-1-5-18:(OI)(CI)F",
                "*S-1-5-32-544:(OI)(CI)F",
                "${smokePrincipal}:(OI)(CI)M",
                "/T", "/C", "/Q"
              ) `
              -Failure "无法授权 smoke 可写树"
          }

          $userName = "mrsmoke$env:GITHUB_RUN_ATTEMPT"
          $passwordText = [Convert]::ToBase64String(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          ) + "aA1!"
          Write-Output "::add-mask::$passwordText"
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $credential = [pscredential]::new("$env:COMPUTERNAME\$userName", $securePassword)
          $standardUser = New-LocalUser `
            -Name $userName `
            -Password $securePassword `
            -PasswordNeverExpires `
            -UserMayNotChangePassword
          try {
            foreach ($requiredDirectory in @($env:SMOKE_ROOT, $env:SMOKE_INPUTS, $env:SMOKE_WORK)) {
              if (-not [System.IO.Path]::IsPathFullyQualified($requiredDirectory) -or
                  -not (Test-Path -LiteralPath $requiredDirectory -PathType Container)) {
                throw "smoke ACL 目录无效"
              }
            }
            if ((Split-Path -Parent $env:SMOKE_INPUTS) -cne $env:SMOKE_ROOT -or
                (Split-Path -Parent $env:SMOKE_WORK) -cne $env:SMOKE_ROOT) {
              throw "smoke inputs/work 必须是 root 的直接隔离子目录"
            }

            $smokePrincipal = "*$($standardUser.SID.Value)"
            $runnerPrincipal = "*$([Security.Principal.WindowsIdentity]::GetCurrent().User.Value)"
            Protect-SmokeReadOnlyTree $env:SMOKE_ROOT $smokePrincipal $runnerPrincipal
            Protect-SmokeReadOnlyTree $env:SMOKE_INPUTS $smokePrincipal $runnerPrincipal
            Protect-SmokeWritableTree $env:SMOKE_WORK $smokePrincipal $runnerPrincipal

            function Quote-PowerShell([string] $value) {
              return "'" + $value.Replace("'", "''") + "'"
            }
            $command = @(
              "& $(Quote-PowerShell $env:SMOKE_RUNNER)",
              "-PreviousInstaller $(Quote-PowerShell $env:PREVIOUS_INSTALLER)",
              "-PreviousVersion $(Quote-PowerShell $env:PREVIOUS_VERSION)",
              "-SmokeHarness $(Quote-PowerShell $env:SMOKE_HARNESS)",
              "-DraftStaging $(Quote-PowerShell $env:DRAFT_STAGING)",
              "-TauriConfig $(Quote-PowerShell $env:TAURI_CONFIG_PATH)",
              "-Tag $(Quote-PowerShell $env:GITHUB_REF_NAME)",
              "-CommitSha $(Quote-PowerShell $env:GITHUB_SHA)",
              "-AppDataDirectory $(Quote-PowerShell $env:APP_DATA_PATH)",
              "-EvidencePath $(Quote-PowerShell $env:EVIDENCE_PATH)"
            ) -join " "
            $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
            $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
            Remove-CredentialEnvironment
            $process = Start-Process `
              -FilePath $pwsh `
              -ArgumentList @("-NoLogo", "-NoProfile", "-NonInteractive", "-EncodedCommand", $encoded) `
              -Credential $credential `
              -LoadUserProfile `
              -PassThru `
              -Wait
            if ($process.ExitCode -ne 0) {
              throw "标准用户 N-1 到 N smoke 失败，exit=$($process.ExitCode)"
            }
          } finally {
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path -LiteralPath $env:EVIDENCE_PATH -PathType Leaf)) {
            throw "标准用户 smoke 未生成 evidence"
          }
          $evidenceFile = Get-Item -LiteralPath $env:EVIDENCE_PATH
          if ($evidenceFile.Length -le 0 -or $evidenceFile.Length -gt 16384) {
            throw "smoke evidence 大小不受允许"
          }
          $evidenceBytes = [System.IO.File]::ReadAllBytes($evidenceFile.FullName)
          if ($evidenceBytes.Length -ge 3 -and
              $evidenceBytes[0] -eq 0xef -and
              $evidenceBytes[1] -eq 0xbb -and
              $evidenceBytes[2] -eq 0xbf) {
            throw "smoke evidence 不允许 UTF-8 BOM"
          }
          try {
            $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
            $evidenceText = $strictUtf8.GetString($evidenceBytes)
            $evidence = $evidenceText | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "smoke evidence 不是严格 UTF-8 JSON"
          }

          $expectedEvidenceProperties = @(
            "schema",
            "previousVersion",
            "targetVersion",
            "candidateId",
            "releaseTag",
            "commitSha",
            "standardUser",
            "processElevated",
            "githubTokenAbsent",
            "ciCredentialsAbsent",
            "installedProductVersion",
            "candidateRelaunched",
            "databasePreserved",
            "typedPreferencePreserved",
            "checkpointConsumed",
            "updaterCacheClean",
            "baselineStartupCount",
            "verifiedStartupCount"
          )
          $actualEvidenceProperties = @($evidence.PSObject.Properties.Name)
          $propertyDifference = @(
            Compare-Object `
              -ReferenceObject $expectedEvidenceProperties `
              -DifferenceObject $actualEvidenceProperties `
              -CaseSensitive
          )
          if ($actualEvidenceProperties.Count -ne $expectedEvidenceProperties.Count -or
              $propertyDifference.Count -ne 0) {
            throw "smoke evidence schema 字段集不匹配"
          }

          $targetVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ([version]$env:PREVIOUS_VERSION -ge [version]$targetVersion) {
            throw "N-1 version 必须严格低于候选版本"
          }
          if ($evidence.schema -cne "mineradio-draft-upgrade-smoke-v1" -or
              $evidence.releaseTag -cne $env:GITHUB_REF_NAME -or
              $evidence.commitSha -cne $env:GITHUB_SHA -or
              $evidence.targetVersion -cne $targetVersion -or
              $evidence.previousVersion -cne $env:PREVIOUS_VERSION -or
              $evidence.candidateId -notmatch '^[0-9a-f]{64}$' -or
              $evidence.standardUser -ne $true -or
              $evidence.processElevated -ne $false -or
              $evidence.githubTokenAbsent -ne $true -or
              $evidence.ciCredentialsAbsent -ne $true -or
              $evidence.installedProductVersion -cne $targetVersion -or
              $evidence.candidateRelaunched -ne $true -or
              $evidence.databasePreserved -ne $true -or
              $evidence.typedPreferencePreserved -ne $true -or
              $evidence.checkpointConsumed -ne $true -or
              $evidence.updaterCacheClean -ne $true) {
            throw "smoke evidence 不完整"
          }

          $evidenceSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($evidenceBytes)
          ).ToLowerInvariant()
          if ($evidenceSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "smoke evidence SHA-256 格式无效"
          }
          "candidate_id=$($evidence.candidateId)" | Out-File -FilePath $jobOutputPath -Encoding utf8 -Append
          "previous_version=$($evidence.previousVersion)" | Out-File -FilePath $jobOutputPath -Encoding utf8 -Append
          "target_version=$($evidence.targetVersion)" | Out-File -FilePath $jobOutputPath -Encoding utf8 -Append
          "evidence_sha256=$evidenceSha256" | Out-File -FilePath $jobOutputPath -Encoding utf8 -Append

      - name: Upload bounded smoke evidence
        id: upload_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-smoke-evidence-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.evidence }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false

  publish-release:
    name: Publish the exact smoke-approved Draft
    needs:
      - build-windows
      - sign-windows
      - stage-release-draft
      - smoke-upgrade
    runs-on: windows-2022
    environment: production-release
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Download signed release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign-windows.outputs.signed_artifact_name }}
          path: ${{ runner.temp }}\signed-release

      - name: Download updater signature verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.verifier_artifact_name }}
          path: ${{ runner.temp }}\release-verifier

      - name: Download bounded smoke evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-smoke-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}\smoke-evidence

      - name: Reverify bounded smoke evidence
        shell: pwsh
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}\smoke-evidence
          EVIDENCE_SHA256: ${{ needs.smoke-upgrade.outputs.evidence_sha256 }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ needs.smoke-upgrade.outputs.evidence_artifact_digest }}
          EXPECTED_CANDIDATE_ID: ${{ needs.smoke-upgrade.outputs.candidate_id }}
          EXPECTED_PREVIOUS_VERSION: ${{ needs.smoke-upgrade.outputs.previous_version }}
          EXPECTED_TARGET_VERSION: ${{ needs.smoke-upgrade.outputs.target_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $stableVersionPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          if ($env:EVIDENCE_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw "smoke evidence SHA-256 输出无效"
          }
          if ($env:EVIDENCE_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "smoke evidence artifact digest 输出无效"
          }
          if ($env:EXPECTED_CANDIDATE_ID -notmatch '^[0-9a-f]{64}$') {
            throw "smoke candidate id 输出无效"
          }
          if ($env:EXPECTED_PREVIOUS_VERSION -notmatch $stableVersionPattern -or
              $env:EXPECTED_TARGET_VERSION -notmatch $stableVersionPattern) {
            throw "smoke 版本输出不是稳定 SemVer"
          }
          if ($env:GITHUB_REF_NAME -cne "v$($env:EXPECTED_TARGET_VERSION)") {
            throw "smoke target version 与发布 tag 不一致"
          }
          if ([version]$env:EXPECTED_PREVIOUS_VERSION -ge [version]$env:EXPECTED_TARGET_VERSION) {
            throw "smoke N-1 version 必须严格低于候选版本"
          }

          if (-not [System.IO.Path]::IsPathFullyQualified($env:EVIDENCE_DIRECTORY) -or
              -not (Test-Path -LiteralPath $env:EVIDENCE_DIRECTORY -PathType Container)) {
            throw "smoke evidence 下载目录无效"
          }
          $evidenceDirectory = [System.IO.Path]::GetFullPath($env:EVIDENCE_DIRECTORY)
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar,
            [System.IO.Path]::AltDirectorySeparatorChar
          )
          if (-not $evidenceDirectory.StartsWith(
                "$runnerTemp$([System.IO.Path]::DirectorySeparatorChar)",
                [StringComparison]::OrdinalIgnoreCase
              )) {
            throw "smoke evidence 下载目录不在 runner temp 内"
          }
          $evidenceFiles = @(
            Get-ChildItem -LiteralPath $evidenceDirectory -File -Recurse -Force
          )
          if ($evidenceFiles.Count -ne 1 -or $evidenceFiles[0].Name -cne "smoke-evidence.json") {
            throw "smoke evidence artifact 必须只包含一个规范 evidence 文件"
          }
          $evidenceFile = $evidenceFiles[0]
          if ($evidenceFile.Length -le 0 -or $evidenceFile.Length -gt 16384) {
            throw "smoke evidence 大小不受允许"
          }
          $evidenceBytes = [System.IO.File]::ReadAllBytes($evidenceFile.FullName)
          if ($evidenceBytes.Length -ge 3 -and
              $evidenceBytes[0] -eq 0xef -and
              $evidenceBytes[1] -eq 0xbb -and
              $evidenceBytes[2] -eq 0xbf) {
            throw "smoke evidence 不允许 UTF-8 BOM"
          }
          try {
            $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
            $evidenceText = $strictUtf8.GetString($evidenceBytes)
            $evidence = $evidenceText | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "smoke evidence 不是严格 UTF-8 JSON"
          }

          $expectedEvidenceProperties = @(
            "schema",
            "previousVersion",
            "targetVersion",
            "candidateId",
            "releaseTag",
            "commitSha",
            "standardUser",
            "processElevated",
            "githubTokenAbsent",
            "ciCredentialsAbsent",
            "installedProductVersion",
            "candidateRelaunched",
            "databasePreserved",
            "typedPreferencePreserved",
            "checkpointConsumed",
            "updaterCacheClean",
            "baselineStartupCount",
            "verifiedStartupCount"
          )
          $actualEvidenceProperties = @($evidence.PSObject.Properties.Name)
          $propertyDifference = @(
            Compare-Object `
              -ReferenceObject $expectedEvidenceProperties `
              -DifferenceObject $actualEvidenceProperties `
              -CaseSensitive
          )
          if ($actualEvidenceProperties.Count -ne $expectedEvidenceProperties.Count -or
              $propertyDifference.Count -ne 0) {
            throw "smoke evidence schema 字段集不匹配"
          }

          $actualEvidenceSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($evidenceBytes)
          ).ToLowerInvariant()
          if ($actualEvidenceSha256 -cne $env:EVIDENCE_SHA256) {
            throw "smoke evidence 内容 SHA-256 与 smoke job 输出不一致"
          }
          if ($evidence.schema -cne "mineradio-draft-upgrade-smoke-v1" -or
              $evidence.releaseTag -cne $env:GITHUB_REF_NAME -or
              $evidence.commitSha -cne $env:GITHUB_SHA -or
              $evidence.targetVersion -cne $env:EXPECTED_TARGET_VERSION -or
              $evidence.previousVersion -cne $env:EXPECTED_PREVIOUS_VERSION -or
              $evidence.candidateId -cne $env:EXPECTED_CANDIDATE_ID -or
              $evidence.candidateId -notmatch '^[0-9a-f]{64}$' -or
              $evidence.standardUser -ne $true -or
              $evidence.processElevated -ne $false -or
              $evidence.githubTokenAbsent -ne $true -or
              $evidence.ciCredentialsAbsent -ne $true -or
              $evidence.installedProductVersion -cne $env:EXPECTED_TARGET_VERSION -or
              $evidence.candidateRelaunched -ne $true -or
              $evidence.databasePreserved -ne $true -or
              $evidence.typedPreferencePreserved -ne $true -or
              $evidence.checkpointConsumed -ne $true -or
              $evidence.updaterCacheClean -ne $true -or
              $evidence.baselineStartupCount -lt 1 -or
              $evidence.verifiedStartupCount -le $evidence.baselineStartupCount) {
            throw "smoke evidence 与本次发布身份或验收结果不一致"
          }

      - name: Reverify and publish exact Draft release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.stage-release-draft.outputs.release_id }}
          EXPECTED_CANDIDATE_ID: ${{ needs.smoke-upgrade.outputs.candidate_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_ID -notmatch '^[1-9]\d*$') { throw "Draft release id 无效" }
          if ($env:EXPECTED_CANDIDATE_ID -notmatch '^[0-9a-f]{64}$') {
            throw "smoke candidate id 无效"
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exeName = "MineRadio-Tauri_${version}_x64-setup.exe"
          $signed = Join-Path $env:RUNNER_TEMP "signed-release"
          $verifier = Join-Path $env:RUNNER_TEMP "release-verifier/verify_updater_signature.exe"
          & bun scripts/ci/publish-release-draft.mjs `
            $env:RELEASE_ID `
            $env:EXPECTED_CANDIDATE_ID `
            --repository $env:GITHUB_REPOSITORY `
            --tag $env:GITHUB_REF_NAME `
            --commit-sha $env:GITHUB_SHA `
            --default-branch $env:DEFAULT_BRANCH `
            --tauri-config-path (Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json") `
            --signature-verifier-path $verifier `
            --exe-path (Join-Path $signed $exeName) `
            --exe-sig-path (Join-Path $signed "$exeName.sig") `
            --manifest-path (Join-Path $signed "latest.json") `
            --provenance-path (Join-Path $signed "release-provenance.json") `
            --provenance-sig-path (Join-Path $signed "release-provenance.json.sig")
          if ($LASTEXITCODE -ne 0) { throw "公开 exact Draft Release 失败" }

  probe-public-release:
    name: Probe the public production discovery path
    needs:
      - publish-release
      - smoke-upgrade
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install Rust 1.95.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "安装 Rust 1.95.0 失败" }
          & rustup default 1.95.0
          if ($LASTEXITCODE -ne 0) { throw "切换 Rust 1.95.0 失败" }

      - name: Install workspace dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "安装 discovery probe 依赖失败" }

      - name: Build CI-only updater probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cargo build `
            --manifest-path apps/desktop/src-tauri/Cargo.toml `
            --release `
            --locked `
            --features updater-smoke `
            --example updater-smoke
          if ($LASTEXITCODE -ne 0) { throw "构建 updater discovery probe 失败" }

      - name: Verify public latest through the production GitHub source
        shell: pwsh
        env:
          PREVIOUS_VERSION: ${{ needs.smoke-upgrade.outputs.previous_version }}
          TARGET_VERSION: ${{ needs.smoke-upgrade.outputs.target_version }}
          CANDIDATE_ID: ${{ needs.smoke-upgrade.outputs.candidate_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN) {
            throw "公开 discovery probe 不得依赖 GitHub token"
          }
          $harness = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/examples/updater-smoke.exe"
          $config = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json"
          $verified = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            & $harness probe-public `
              $config `
              $env:PREVIOUS_VERSION `
              $env:TARGET_VERSION `
              $env:CANDIDATE_ID
            if ($LASTEXITCODE -eq 0) {
              $verified = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $verified) {
            throw "公开 /latest 未在 bounded retry 内收敛到 smoke-approved candidate"
          }
