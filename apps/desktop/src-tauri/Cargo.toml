[package]
name = "mineradio-tauri"
version = "2.1.0"
description = "GPL-3.0-only Rust desktop runtime for MineRadio-Tauri; bundled web assets may carry separate license notices"
authors = ["MineRadio-Tauri contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "mineradio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.2"
mineradio_api = { package = "MineRadio-api", path = "../../../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4.3"
sha2 = "0.10"
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
semver = "=1.0.28"
url = "=2.5.8"
urlencoding = "=2.1.0"
dirs = "5"
time = { version = "0.3", features = ["formatting", "parsing"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "=0.7.18", default-features = false }
lofty = "0.22"
encoding_rs = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows-sys = { version = "0.61", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
updater-smoke = []

[[example]]
name = "updater-smoke"
path = "examples/updater_smoke.rs"
required-features = ["updater-smoke"]
